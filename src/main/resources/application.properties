spring.application.name=team-finder

# ===== Server =====
server.port=8080

# ===== Database (PostgreSQL - overridden by env vars) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/teamfinder}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# Note: Hibernate 6 auto-detects PostgreSQLDialect — no need to set it explicitly
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# Secret must be Base64-encoded, at least 256 bits for HS256
# CHANGE THIS IN PRODUCTION! Generate with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:dGVhbS1maW5kZXItc2VjcmV0LWtleS12ZXJ5LWxvbmctZW5vdWdoLWZvci1IUzI1Ni1hbGdvcml0aG0=}
# Access token: 15 minutes
app.jwt.access-token-expiration-ms=900000
# Refresh token: 7 days
app.jwt.refresh-token-expiration-days=7

# ===== Springdoc / Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===== Logging =====
logging.level.com.example.teamfinder=INFO
logging.level.org.springframework.security=WARN
